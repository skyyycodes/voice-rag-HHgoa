[project]
name = "vrag"
version = "0.1.0"
description = "Voice-enabled RAG over MSMARCO-XI with sub-200ms retrieval, multi-strategy chunking, and grounding guardrails"
readme = "README.md"
authors = [
    { name = "Akash Chakraborty", email = "akashchakraborty694@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "bm25s>=0.3.10",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.27.0",
    "numpy>=2.5.2",
    "onnxruntime>=1.28.0",
    "orjson>=3.12.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "tokenizers>=0.23.1",
    "usearch>=2.26.0",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
